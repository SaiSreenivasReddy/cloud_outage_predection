x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  env_file: .env
  environment:
    # ── Core ──────────────────────────────────────────────────────────────────
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution
    # ── Database ──────────────────────────────────────────────────────────────
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_URL}
    # ── API Server / Webserver (Airflow 3 unified) ────────────────────────────
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    # Simple Auth Manager (default in Airflow 3 dev)
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/data/passwords.json
    # ── API auth ──────────────────────────────────────────────────────────────
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__SECRETS__JWT_SECRET: ${AIRFLOW_SECRET_KEY}
    # ── Scheduler ─────────────────────────────────────────────────────────────
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
    # ── Application env vars forwarded into tasks ─────────────────────────────
    API_URL: http://api:8000
    TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_DB: ${POSTGRES_DB}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./data:/opt/airflow/data
    - ./gx:/opt/airflow/gx
    - airflow_logs:/opt/airflow/logs
  depends_on:
    airflow-db:
      condition: service_healthy

services:
  # ─── Application Database ───────────────────────────────────────────────────
  db:
    image: postgres:15
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ─── Airflow Metadata Database ──────────────────────────────────────────────
  airflow-db:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U airflow" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ─── Airflow Init ───────────────────────────────────────────────────────────
  # Runs once: DB migration + admin user (via fab) + postgres_default connection
  airflow-init:
    <<: *airflow-common
    entrypoint: /entrypoints/init.sh
    command: ""
    restart: "no"
    depends_on:
      airflow-db:
        condition: service_healthy
      db:
        condition: service_healthy

  # ─── Airflow Scheduler ──────────────────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ─── Airflow API Server ─────────────────────────────────────────────────────
  # In Airflow 3, 'api-server' replaces the old 'webserver'.
  # It serves both the new React UI AND the REST API on the same port.
  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/api/v2/version" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ─── Airflow DAG Processor ──────────────────────────────────────────────────
  # Airflow 3 separates DAG parsing from scheduling for better isolation.
  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ─── Model Service (FastAPI) ─────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: model_service/Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./model_service:/app
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # ─── Streamlit Webapp ────────────────────────────────────────────────────────
  webapp:
    build:
      context: .
      dockerfile: webapp/Dockerfile
    env_file: .env
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ─── nginx — serves GX Data Docs HTML reports ────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "8090:80"
    volumes:
      - ./gx/gx/uncommitted/data_docs/local_site:/usr/share/nginx/html:ro
    restart: unless-stopped

volumes:
  postgres_data:
  airflow_postgres_data:
  airflow_logs:
